[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sort-gap-study"
version = "0.1.0"
description = "Study of SORT under consecutive observation gaps"
requires-python = ">=3.11,<3.12"
dependencies = [
    "matplotlib",
    "numpy",
    "pandas",
    "scipy",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
