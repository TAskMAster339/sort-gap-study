[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sort-gap-study"
version = "0.1.0"
description = "Study of SORT under consecutive observation gaps"
requires-python = ">=3.11,<3.12"
dependencies = [
    "matplotlib",
    "numpy",
    "pandas",
    "scipy",
]

[project.scripts]
sort-gap-study = "sort_gap_study.cli:main"

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
    "A",
    "B",
    "C4",
    "C90",
    "COM",
    "DTZ",
    "E",
    "ERA",
    "EXE",
    "F",
    "FBT",
    "FLY",
    "FURB",
    "G",
    "I",
    "ICN",
    "ISC",
    "LOG",
    "N",
    "PERF",
    "PIE",
    "PL",
    "PT",
    "PTH",
    "Q",
    "RET",
    "RSE",
    "RUF",
    "S",
    "SIM",
    "SLF",
    "SLOT",
    "T100",
    "UP",
    "W",
    "YTT",
]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["S101"]
